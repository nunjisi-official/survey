<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>넌지시(Nunjisi) - 100선 행동경제학 맞춤형 넛지 처방전</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --primary-orange: #E67E22;
            --primary-yellow: #F39C12;
            --dark-orange: #D35400;
            --bg-cream: #FFFDF9;
            --card-bg-start: #FFF6EE;
            --card-bg-end: #FFF9E6;
            --text-dark: #4A3B32;
            --text-muted: #7F8C8D;
            --border-color: #F5D0A9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 20px 15px 60px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 35px;
            padding: 20px 0 10px;
        }

        .brand-logo {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--primary-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .brand-subtitle {
            font-size: 1.15rem;
            color: var(--dark-orange);
            font-weight: 600;
            word-break: keep-all;
        }

        .form-card {
            background: #FFFFFF;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(230, 126, 34, 0.08);
            margin-bottom: 40px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #E0E0E0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background-color: #FAFAFA;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-orange);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.15);
        }

        textarea.form-control { resize: vertical; min-height: 90px; }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-orange), var(--dark-orange));
            color: #FFFFFF;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(230, 126, 34, 0.25);
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(230, 126, 34, 0.35);
        }

        .board-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px dashed var(--border-color);
        }

        .board-title { font-size: 1.5rem; font-weight: 800; color: var(--dark-orange); }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 7px 12px;
            border-radius: 20px;
            border: 1.5px solid var(--border-color);
            background: #fff;
            color: var(--text-dark);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: var(--primary-orange);
            color: #fff;
            border-color: var(--primary-orange);
        }

        .cards-grid { display: grid; grid-template-columns: 1fr; gap: 25px; }

        .nudge-card {
            background: linear-gradient(135deg, var(--card-bg-start) 0%, var(--card-bg-end) 100%);
            border: 2px solid var(--primary-yellow);
            border-radius: 20px;
            padding: 25px;
            position: relative;
            box-shadow: 0 8px 20px rgba(230, 126, 34, 0.1);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(230, 126, 34, 0.2);
        }

        .user-tag {
            background-color: var(--primary-orange);
            color: #FFFFFF;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .timestamp { font-size: 0.8rem; color: var(--text-muted); }

        .user-problem-box {
            background-color: rgba(255, 255, 255, 0.7);
            border-left: 4px solid var(--primary-orange);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            word-break: keep-all;
        }

        .solution-section { display: grid; grid-template-columns: 1fr; gap: 12px; }

        .info-item {
            background: #FFFFFF;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(243, 156, 18, 0.3);
        }

        .info-item .label {
            font-weight: 800;
            color: var(--dark-orange);
            font-size: 0.9rem;
            display: block;
            margin-bottom: 4px;
        }

        .info-item .content {
            font-size: 0.95rem;
            color: var(--text-dark);
            word-break: keep-all;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            background: #FFFFFF;
            border: 2px dashed #E0E0E0;
            border-radius: 20px;
            color: var(--text-muted);
        }

        .loading-state {
            text-align: center;
            padding: 30px;
            font-weight: 700;
            color: var(--primary-orange);
        }

        footer { text-align: center; margin-top: 50px; color: var(--text-muted); font-size: 0.85rem; }

        @media (min-width: 768px) {
            body { padding: 40px 20px 80px; }
            .solution-section { grid-template-columns: repeat(2, 1fr); }
            .full-width { grid-column: span 2; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand-logo">🍊 넌지시</div>
        <div class="brand-subtitle">100가지 행동경제학 사례로 일상을 바꾸는 맞춤형 넛지 처방전</div>
    </header>

    <!-- 입력 폼 -->
    <div class="form-card">
        <form id="nudgeForm">
            <div class="form-group">
                <label for="userName">👤 이름 또는 기업 / 단체명</label>
                <input type="text" id="userName" class="form-control" placeholder="예: 고양국제고 / 성연" required>
            </div>
            <div class="form-group">

                <textarea id="userProblem" class="form-control" placeholder="예: 세금 체납이 고민이에요 / 회의가 자꾸 지연돼요 / 공부할 때 폰을 너무 봐요" required></textarea>
            </div>
            <button type="submit" class="btn-submit" id="btnSubmit">✨ 맞춤형 넛지 솔루션 처방받기</button>
        </form>
    </div>

    <!-- 처방 결과 보드 및 10대 카테고리 필터 -->
    <div class="board-header">
        <div class="board-title">📋 실시간 넛지 처방 보드</div>
        <div class="filter-tabs">

            <button class="filter-btn" data-category="공공·행정">🏛️ 공공·행정</button>
            <button class="filter-btn" data-category="이커머스">🛒 이커머스</button>
            <button class="filter-btn" data-category="디지털웰빙">📱 디지털웰빙</button>

            <button class="filter-btn" data-category="사회·관계">🤝 사회·관계</button>

    </div>

    <footer>

</div>

        { category: "사회·관계", keywords: ["고립", "외로움", "안부"], strategy: "정기 안부 체크인 서비스 넛지", mechanism: "혼자 사는 어르신이나 1인가구에게 가벼운 문답이나 자동 안부 체크인 서비스를 제공합니다.", location: "모바일 알림톡, 스마트폰 앱", elements: "원클릭 '오늘도 건강해요' 버튼", copywriting: "'오늘 하루도 무탈하게 잘 지내고 계신지 따뜻한 안부를 여쭙니다.'", bizItem: "1인가구 안심 케어 체크인 서비스" },
        { category: "사회·관계", keywords: ["예약", "노쇼", "방문"], strategy: "능동적 약속(Direct Input) 넛지", mechanism: "'예약 확인' 버튼 대신 방문 예정 시간을 직접 키보드로 입력하게 만들어 노쇼를 방지합니다.", location: "예약 완료 페이지", elements: "시간 직접 입력 폼", copywriting: "'방문하실 정확한 시간을 직접 입력해 주세요. 소중한 약속을 기다립니다.'", bizItem: "노쇼 방지 스마트 예약 시스템" },
        { category: "사회·관계", keywords: ["줄서기", "혼란", "대기선"], strategy: "바닥 대기선 및 시각적 질서 넛지", mechanism: "바닥에 명확한 대기선과 동선을 스티커로 표시해 자연스럽게 한 줄 서기를 유도합니다.", location: "매장 카운터 앞, 승강장 바닥", elements: "알록달록한 동선 유도 스티커", copywriting: "'순서대로 차례를 지켜주시는 당신의 멋진 매너에 감사드립니다.'", bizItem: "공간 동선 유도 랩핑 키트" },
        { category: "사회·관계", keywords: ["도서", "연체", "반납"], strategy: "리마인더 및 연체 누적 시각화 넛지", mechanism: "반납일 전 친절한 알림을 주고, 연체될 경우 다른 사람들이 책을 못 보는 상황을 시각화합니다.", location: "도서관 앱 알림", elements: "대기자 수 표시, 반납 기한 카운터", copywriting: "'다음 친구가 이 책을 기다리고 있어요! 오늘 꼭 도서관에 들러주세요.'", bizItem: "스마트 도서관 반납 알림 봇" },
        { category: "사회·관계", keywords: ["공공장소", "소음", "공감"], strategy: "공감 프레이밍 안내문 넛지", mechanism: "'정숙하세요' 같은 명령조 대신 '다른 분들을 배려해 주세요'라는 공감형 문구를 배치합니다.", location: "도서관, 독서실, 카페 벽면", elements: "부드러운 일러스트 안내판", copywriting: "'우리 모두의 편안한 휴식을 위해 작은 목소리로 이야기해 주세요.'", bizItem: "공공장소 매너 사이니지 세트" },
        { category: "사회·관계", keywords: ["새", "습관", "트래커"], strategy: "습관 스태킹(Habit Stacking) 및 21일 트래커 넛지", mechanism: "기존의 익숙한 습관에 새 습관을 얹고 21일간 칸을 채워나가는 트래커를 제공합니다.", location: "개인 다이어리, 습관 앱", elements: "21일 달성 체크 스티커 판", copywriting: "'양치질을 한 직후에 물 한 잔 마시기! 21일 동안 멋지게 채워볼까요?'", bizItem: "행동변화 21일 스태킹 트래커" }
    ];

    const DEFAULT_NUDGE = {
        category: "환경·에너지",
        strategy: "행동 유도형 공간 재배치 및 맥락 프레이밍 넛지",
        mechanism: "선택 구조(Choice Architecture)를 재설계하여 부담이나 강요 없이 원하는 행동의 실행 장벽을 낮춥니다.",
        location: "문제 행동이 발생하는 접점 및 시선이 머무는 동선",
        elements: "직관적 픽토그램 안내판, 동선 스티커",
        copywriting: "'작은 관심이 더 나은 환경을 만듭니다. 함께해 주실 거죠?'",
        bizItem: "현장 맥락 분석 리포트 및 맞춤형 넛지 사이니지 제작"
    };

    const nudgeForm = document.getElementById('nudgeForm');
    const cardsGrid = document.getElementById('cardsGrid');
    const btnSubmit = document.getElementById('btnSubmit');

    // 페이지 로드 시 구글시트에서 누적된 처방 기록 불러오기 (GET)
    document.addEventListener('DOMContentLoaded', fetchHistoryFromSheet);

    nudgeForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const name = document.getElementById('userName').value.trim();
        const problem = document.getElementById('userProblem').value.trim();

        if (!name || !problem) return;

        btnSubmit.disabled = true;
        btnSubmit.innerText = "⏳ 100선 DB 분석 및 처방전 작성 중...";

        // 100선 내장 DB에서 키워드 매칭 검색
        let matchedNudge = DEFAULT_NUDGE;
        let maxScore = 0;

        for (const item of NUDGE_DATABASE) {
            let score = 0;
            item.keywords.forEach(kw => {
                if (problem.includes(kw)) {
                    score += 1;
                }
            });
            if (score > maxScore) {
                maxScore = score;
                matchedNudge = item;
            }
        }

        const newCardData = {
            id: Date.now(),
            name: name,
            problem: problem,
            solution: matchedNudge,
            timestamp: new Date().toLocaleString('ko-KR', { 
                month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' 
            })
        };

        // 구글 시트에 처방 기록 저장 (POST)
        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newCardData)
            });

            resetFilterToAll();
            renderCard(newCardData, true);
            document.getElementById('userProblem').value = '';
        } catch (error) {
            alert("DB 저장 중 오류가 발생했습니다. 다시 시도해주세요.");
            console.error(error);
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerText = "✨ 맞춤형 넛지 솔루션 처방받기";
        }
    });

    // 구글 시트에서 누적 기록 가져오기
    async function fetchHistoryFromSheet() {
        try {
            const response = await fetch(GOOGLE_SCRIPT_URL);
            const historyData = await response.json();
            
            cardsGrid.innerHTML = '';
            if (!historyData || historyData.length === 0) {
                cardsGrid.innerHTML = `
                    <div class="empty-state">
                        <p>💡 위 폼에 고민을 입력하시면 100선 기반 맞춤형 넛지 처방전이 이곳에 쌓입니다.</p>
                    </div>
                `;
            } else {
                historyData.forEach(card => renderCard(card, false));
            }
        } catch (error) {
            console.error("데이터 불러오기 실패:", error);
            cardsGrid.innerHTML = `
                <div class="empty-state">
                    <p>⚠️ 처방 보드를 불러오는 데 실패했습니다. Apps Script URL을 확인해주세요.</p>
                </div>
            `;
        }
    }

    function renderCard(card, isNew) {
        const emptyState = document.querySelector('.empty-state');
        if (emptyState) emptyState.remove();

        const cardEl = document.createElement('div');
        cardEl.className = 'nudge-card';
        const cardCategory = card.solution && card.solution.category ? card.solution.category : '환경·에너지';
        cardEl.setAttribute('data-category', cardCategory);

        cardEl.innerHTML = `
            <div class="card-header-info">
                <span class="user-tag">🏢 ${card.name} 님의 고민 (${cardCategory})</span>
                <span class="timestamp">${card.timestamp}</span>
            </div>
            <div class="user-problem-box">
                " ${card.problem} "
            </div>
            <div class="solution-section">
                <div class="info-item full-width">
                    <span class="label">🎯 추천 넛지 전략</span>
                    <span class="content">${card.solution.strategy}</span>
                </div>
                <div class="info-item full-width">
                    <span class="label">🧠 심리학적 메커니즘</span>
                    <span class="content">${card.solution.mechanism}</span>
                </div>
                <div class="info-item">
                    <span class="label">📍 실천 장소 및 적용 포인트</span>
                    <span class="content">${card.solution.location}</span>
                </div>
                <div class="info-item">
                    <span class="label">🎨 물리적 / 디자인 요소</span>
                    <span class="content">${card.solution.elements}</span>
                </div>
                <div class="info-item full-width">
                    <span class="label">💬 추천 안내 문구 (카피라이팅)</span>
                    <span class="content">${card.solution.copywriting}</span>
                </div>
                <div class="info-item full-width">
                    <span class="label">📦 넌지시 제안 제품 / 서비스</span>
                    <span class="content">${card.solution.bizItem}</span>
                </div>
            </div>
        `;

        if (isNew) {
            cardsGrid.prepend(cardEl);
        } else {
            cardsGrid.appendChild(cardEl);
        }
    }

    // 카테고리 필터 탭 클릭 이벤트
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('filter-btn')) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            e.target.classList.add('active');

            const selectedCategory = e.target.getAttribute('data-category');
            const cards = document.querySelectorAll('.nudge-card');

            cards.forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                if (selectedCategory === 'all' || cardCategory === selectedCategory) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    });

    function resetFilterToAll() {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-category') === 'all') {
                btn.classList.add('active');
            }
        });
        document.querySelectorAll('.nudge-card').forEach(card => {
            card.style.display = 'block';
        });
    }
</script>
