<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>넌지시(Nunjisi) - 일상을 바꾸는 따뜻한 넛지 솔루션</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --primary-orange: #E67E22;
            --primary-yellow: #F39C12;
            --dark-orange: #D35400;
            --bg-cream: #FFFDF9;
            --card-bg-start: #FFF6EE;
            --card-bg-end: #FFF9E6;
            --text-dark: #4A3B32;
            --text-muted: #7F8C8D;
            --border-color: #F5D0A9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 20px 15px 60px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            padding: 20px 0 10px;
        }

        .brand-logo {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--primary-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .brand-subtitle {
            font-size: 1.15rem;
            color: var(--dark-orange);
            font-weight: 600;
            word-break: keep-all;
        }

        .form-card {
            background: #FFFFFF;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(230, 126, 34, 0.08);
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #E0E0E0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background-color: #FAFAFA;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-orange);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.15);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 90px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-orange), var(--dark-orange));
            color: #FFFFFF;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(230, 126, 34, 0.25);
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(230, 126, 34, 0.35);
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px dashed var(--border-color);
        }

        .board-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--dark-orange);
        }

        .btn-clear {
            background-color: #F2F4F4;
            color: var(--text-muted);
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-clear:hover {
            background-color: #E5E7E9;
            color: #333;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        .nudge-card {
            background: linear-gradient(135deg, var(--card-bg-start) 0%, var(--card-bg-end) 100%);
            border: 2px solid var(--primary-yellow);
            border-radius: 20px;
            padding: 25px;
            position
