<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>넌지시(Nunjisi) - 일상을 바꾸는 따뜻한 넛지 솔루션</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --primary-orange: #E67E22;
            --primary-yellow: #F39C12;
            --dark-orange: #D35400;
            --bg-cream: #FFFDF9;
            --card-bg-start: #FFF6EE;
            --card-bg-end: #FFF9E6;
            --text-dark: #4A3B32;
            --text-muted: #7F8C8D;
            --border-color: #F5D0A9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 20px 15px 60px;
        }

        .container { max-width: 900px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 35px;
            padding: 20px 0 10px;
        }

        .brand-logo {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--primary-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .brand-subtitle {
            font-size: 1.15rem;
            color: var(--dark-orange);
            font-weight: 600;
            word-break: keep-all;
        }

        .form-card {
            background: #FFFFFF;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(230, 126, 34, 0.08);
            margin-bottom: 40px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #E0E0E0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background-color: #FAFAFA;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-orange);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.15);
        }

        textarea.form-control { resize: vertical; min-height: 90px; }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-orange), var(--dark-orange));
            color: #FFFFFF;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(230, 126, 34, 0.25);
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(230, 126, 34, 0.35);
        }

        .board-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px dashed var(--border-color);
        }

        .board-title { font-size: 1.5rem; font-weight: 800; color: var(--dark-orange); }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1.5px solid var(--border-color);
            background: #fff;
            color: var(--text-dark);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: var(--primary-orange);
            color: #fff;
            border-color: var(--primary-orange);
        }

        .cards-grid { display: grid; grid-template-columns: 1fr; gap: 25px; }

        .nudge-card {
            background: linear-gradient(135deg, var(--card-bg-start) 0%, var(--card-bg-end) 100%);
            border: 2px solid var(--primary-yellow);
            border-radius: 20px;
            padding: 25px;
            position: relative;
            box-shadow: 0 8px 20px rgba(230, 126, 34, 0.1);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(230, 126, 34, 0.2);
        }

        .user-tag {
            background-color: var(--primary-orange);
            color: #FFFFFF;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .timestamp { font-size: 0.8rem; color: var(--text-muted); }

        .user-problem-box {
            background-color: rgba(255, 255, 255, 0.7);
            border-left: 4px solid var(--primary-orange);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            word-break: keep-all;
        }

        .solution-section { display: grid; grid-template-columns: 1fr; gap: 12px; }

        .info-item {
            background: #FFFFFF;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(243, 156, 18, 0.3);
        }

        .info-item .label {
            font-weight: 800;
            color: var(--dark-orange);
            font-size: 0.9rem;
            display: block;
            margin-bottom: 4px;
        }

        .info-item .content {
            font-size: 0.95rem;
            color: var(--text-dark);
            word-break: keep-all;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            background: #FFFFFF;
            border: 2px dashed #E0E0E0;
            border-radius: 20px;
            color: var(--text-muted);
        }

        .loading-state {
            text-align: center;
            padding: 30px;
            font-weight: 700;
            color: var(--primary-orange);
        }

        footer { text-align: center; margin-top: 50px; color: var(--text-muted); font-size: 0.85rem; }

        @media (min-width: 768px) {
            body { padding: 40px 20px 80px; }
            .solution-section { grid-template-columns: repeat(2, 1fr); }
            .full-width { grid-column: span 2; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand-logo">🍊 넌지시</div>
        <div class="brand-subtitle">강요하지 않고 자연스럽게 변화를 만드는 맞춤형 넛지 처방전</div>
    </header>

    <!-- 입력 폼 -->
    <div class="form-card">
        <form id="nudgeForm">
            <div class="form-group">
                <label for="userName">👤 이름 또는 기업 / 단체명</label>
                <input type="text" id="userName" class="form-control" placeholder="예: 고양카페 / 김성연" required>
            </div>
            <div class="form-group">
                <label for="userProblem">💬 해결하고 싶은 일상 속 불편함이나 고민</label>
                <textarea id="userProblem" class="form-control" placeholder="예: 매장 입구 옆에 담배꽁초가 계속 무단 투기돼요. / 회의 시간이 자꾸 지연돼요." required></textarea>
            </div>
            <button type="submit" class="btn-submit" id="btnSubmit">✨ 맞춤형 넛지 솔루션 처방받기</button>
        </form>
    </div>

    <!-- 처방 결과 누적 보드 및 카테고리 필터 -->
    <div class="board-header">
        <div class="board-title">📋 실시간 넛지 처방 보드</div>
        <div class="filter-tabs">
            <button class="filter-btn active" data-category="all">전체 보기</button>
            <button class="filter-btn" data-category="환경">🧹 환경·거리</button>
            <button class="filter-btn" data-category="업무">💼 오피스·업무</button>
            <button class="filter-btn" data-category="건강">🏃‍♂️ 건강·생활</button>
            <button class="filter-btn" data-category="디지털">📱 디지털·습관</button>
        </div>
    </div>

    <div id="cardsGrid" class="cards-grid">
        <div class="loading-state">🔄 구글 데이터베이스에서 최신 처방 보드를 불러오는 중...</div>
    </div>

    <footer>
        © 2026 Nunjisi. All rights reserved. 부드러운 변화의 시작, 넌지시.
    </footer>
</div>

<script>
    // 🚨 본인의 Google Apps Script 웹 앱 URL을 입력하세요.
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5EQw2e6SZjofZ4O5hpgPiEBUiD4KLIOyPkuFsTvBPaeMgmvpaMXCxRFG-RAmPoBnz/exec";

    // 넛지 알고리즘 DB (카테고리별 확장)
    const NUDGE_DATABASE = [
        {
            category: "환경",
            keywords: ["쓰레기", "담배", "꽁초", "무단투기", "길거리", "청소", "바닥"],
            strategy: "시각적 유도선 및 피드백 넛지 (Footprints & Interactive Nudge)",
            mechanism: "인간은 명확한 가이드라인이 주어지면 본능적으로 따르며, 유희성(Fun Theory)이 가미되면 자발적으로 행동합니다.",
            location: "무단투기 빈발 구역 및 쓰레기통 주변",
            elements: "노란색 유도 스티커, 투표형 담배꽁초 수거함(A vs B 선택형)",
            copywriting: "'당신의 투표가 깨끗한 거리를 만듭니다'",
            bizItem: "맞춤형 바닥 넛지 랩핑 키트 및 인터랙티브 수거함 렌탈"
        },
        {
            category: "환경",
            keywords: ["잔반", "음식", "급식", "식당", "버리는", "남기는", "식사"],
            strategy: "기본값 조절 및 시각적 직관성 넛지 (Default & Visual Portion Nudge)",
            mechanism: "제공받는 용기의 크기나 기본 세팅이 식사량 및 식습관 선택에 절대적인 영향을 미칩니다.",
            location: "식당 배식대 및 식기 반납구 주변",
            elements: "작은 보조 식기 기본 배치, 잔반 누적 저울 모니터",
            copywriting: "'먹을 만큼만 덜어서 환경을 보호해요'",
            bizItem: "구내식당 친환경 넛지 식기 패키지 및 캠페인 컨설팅"
        },
        {
            category: "업무",
            keywords: ["회의", "시간", "지연", "사내", "업무", "지각", "보고", "토론"],
            strategy: "사회적 현시 및 프레이밍 넛지 (Social Framing & Visible Timer)",
            mechanism: "시간의 흐름이 눈으로 직관적으로 보일 때 집중도가 비약적으로 증가합니다.",
            location: "회의실 중앙 테이블 및 사내 출입구",
            elements: "스탠딩 회의 전용 테이블, 대형 아날로그 카운트다운 타이머",
            copywriting: "'핵심만 명확하게! 15분 스탠딩 타임'",
            bizItem: "스마트 타임박스 타이머 및 업무효율 넛지 가이드북"
        },
        {
            category: "건강",
            keywords: ["계단", "운동", "엘리베이터", "건강", "에너지", "칼로리", "비만"],
            strategy: "즐거움 창출 및 유쾌한 피드백 넛지 (Fun Theory & Calorie Nudge)",
            mechanism: "지루하고 피하고 싶은 일상 과제에 재미 요소나 즉각적인 긍정 피드백을 제공합니다.",
            location: "건물 1층 엘리베이터 옆 계단 입구",
            elements: "발소리에 반응하는 인터랙티브 사운드/조명, 소모 칼로리 표기",
            copywriting: "'1층 오를 때마다 건강 수명 +2분!'",
            bizItem: "맞춤형 피아노 계단 및 건강 넛지 시트"
        },
        {
            category: "디지털",
            keywords: ["공부", "독서", "집중", "스마트폰", "핸드폰", "딴짓", "유혹"],
            strategy: "물리적 거리두기 및 시각적 차단 넛지 (Friction & Out of Sight Nudge)",
            mechanism: "유혹을 자극하는 대상과의 물리적 거리를 멀게 하거나 시야에서 차단하면 자제력을 높일 수 있습니다.",
            location: "책상 위 스마트폰 보관함 및 독서대",
            elements: "불투명 스마트폰 보관 파우치, 시야 차단 거치대",
            copywriting: "'화면이 보이지 않을 때, 진짜 몰입이 시작됩니다.'",
            bizItem: "디지털 디톡스 책상 세트 및 집중력 강화 파우치 패키지"
        }
    ];

    const DEFAULT_NUDGE = {
        category: "환경",
        strategy: "행동 유도형 공간 재배치 및 맥락 프레이밍 넛지",
        mechanism: "선택 구조(Choice Architecture)를 재설계하여 부담이나 강요 없이 원하는 행동의 실행 장벽을 낮춥니다.",
        location: "문제 행동이 발생하는 접점 및 시선이 머무는 동선",
        elements: "직관적 픽토그램 안내판, 동선 스티커",
        copywriting: "'작은 관심이 더 나은 환경을 만듭니다. 함께해 주실 거죠?'",
        bizItem: "현장 맥락 분석 리포트 및 맞춤형 넛지 사이니지 제작"
    };

    const nudgeForm = document.getElementById('nudgeForm');
    const cardsGrid = document.getElementById('cardsGrid');
    const btnSubmit = document.getElementById('btnSubmit');

    // 페이지 로드 시 구글시트에서 데이터 읽어오기
    document.addEventListener('DOMContentLoaded', fetchCardsFromSheet);

    nudgeForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const name = document.getElementById('userName').value.trim();
        const problem = document.getElementById('userProblem').value.trim();

        if (!name || !problem) return;

        btnSubmit.disabled = true;
        btnSubmit.innerText = "⏳ 처방전 작성 중 및 DB 저장 중...";

        // 키워드 매칭 점수 산정 방식 (가장 많이 겹치는 항목 매칭)
        let matchedNudge = DEFAULT_NUDGE;
        let maxScore = 0;

        for (const item of NUDGE_DATABASE) {
            let score = 0;
            item.keywords.forEach(kw => {
                if (problem.includes(kw)) {
                    score += 1;
                }
            });
            if (score > maxScore) {
                maxScore = score;
                matchedNudge = item;
            }
        }

        const newCardData = {
            id: Date.now(),
            name: name,
            problem: problem,
            solution: matchedNudge,
            timestamp: new Date().toLocaleString('ko-KR', { 
                month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' 
            })
        };

        // 구글시트에 데이터 저장
        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newCardData)
            });

            // 화면에 새 카드 추가 후 전체 보기 탭으로 리셋
            resetFilterToAll();
            renderCard(newCardData, true);
            document.getElementById('userProblem').value = '';
        } catch (error) {
            alert("DB 저장 중 오류가 발생했습니다. 다시 시도해주세요.");
            console.error(error);
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerText = "✨ 맞춤형 넛지 솔루션 처방받기";
        }
    });

    // 구글시트에서 데이터 불러오기
    async function fetchCardsFromSheet() {
        try {
            const response = await fetch(GOOGLE_SCRIPT_URL);
            const data = await response.json();
            
            cardsGrid.innerHTML = '';
            if (!data || data.length === 0) {
                cardsGrid.innerHTML = `
                    <div class="empty-state">
                        <p>💡 위 폼에 고민을 입력하시면 맞춤형 넛지 처방전이 이곳에 차곡차곡 쌓입니다.</p>
                    </div>
                `;
            } else {
                data.forEach(card => renderCard(card, false));
            }
        } catch (error) {
            console.error("데이터 불러오기 실패:", error);
            cardsGrid.innerHTML = `
                <div class="empty-state">
                    <p>⚠️ 처방 보드를 불러오는 데 실패했습니다. Apps Script URL을 확인해주세요.</p>
                </div>
            `;
        }
    }

    function renderCard(card, isNew) {
        const emptyState = document.querySelector('.empty-state');
        if (emptyState) emptyState.remove();

        const cardEl = document.createElement('div');
        cardEl.className = 'nudge-card';
        const cardCategory = card.solution && card.solution.category ? card.solution.category : '환경';
        cardEl.setAttribute('data-category', cardCategory);

        cardEl.innerHTML = `
            <div class="card-header-info">
                <span class="user-tag">🏢 ${card.name} 님의 고민 (${cardCategory})</span>
                <span class="timestamp">${card.timestamp}</span>
            </div>
            <div class="user-problem-box">
                " ${card.problem} "
            </div>
            <div class="solution-section">
                <div class="info-item full-width">
                    <span class="label">🎯 추천 넛지 전략</span>
                    <span class="content">${card.solution.strategy}</span>
                </div>
                <div class="info-item full-width">
                    <span class="label">🧠 심리학적 메커니즘</span>
                    <span class="content">${card.solution.mechanism}</span>
                </div>
                <div class="info-item">
                    <span class="label">📍 실천 장소 및 적용 포인트</span>
                    <span class="content">${card.solution.location}</span>
                </div>
                <div class="info-item">
                    <span class="label">🎨 물리적 / 디자인 요소</span>
                    <span class="content">${card.solution.elements}</span>
                </div>
                <div class="info-item full-width">
                    <span class="label">💬 추천 안내 문구 (카피라이팅)</span>
                    <span class="content">${card.solution.copywriting}</span>
                </div>
                <div class="info-item full-width">
                    <span class="label">📦 넌지시 제안 제품 / 서비스</span>
                    <span class="content">${card.solution.bizItem}</span>
                </div>
            </div>
        `;

        if (isNew) {
            cardsGrid.prepend(cardEl);
        } else {
            cardsGrid.appendChild(cardEl);
        }
    }

    // 카테고리 필터 탭 클릭 이벤트 처리
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('filter-btn')) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            e.target.classList.add('active');

            const selectedCategory = e.target.getAttribute('data-category');
            const cards = document.querySelectorAll('.nudge-card');

            cards.forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                if (selectedCategory === 'all' || cardCategory === selectedCategory) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    });

    function resetFilterToAll() {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-category') === 'all') {
                btn.classList.add('active');
            }
        });
        document.querySelectorAll('.nudge-card').forEach(card => {
            card.style.display = 'block';
        });
    }
</script>

</body>
</html>
